<VirtualHost *:80>
#   ServerName  globalwarmingindex.org
#   ServerAlias www.globalwarmingindex.org

   DocumentRoot /var/www/html/public

   <Directory "/var/www/html/public">
      AllowOverride All
      Options Indexes FollowSymLinks
      Order allow,deny
      allow from all
   </Directory>

   <IfModule mpm_peruser_module>
      ServerEnvironment apache apache
   </IfModule>

   WSGIScriptAlias /api /var/www/html/api/temp_api.wsgi

   <Directory /var/www/html/api/>
      Options FollowSymLinks
      Order allow,deny
      allow from all
   </Directory>

</VirtualHost>

